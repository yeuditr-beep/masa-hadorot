<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמויות המסע | מסע הדורות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&display=swap');
  :root {
    --navy:#0d1b2e; --gold:#b0862f; --gold-l:#e8c46a;
    --paper:#faf6ee; --paper2:#f3ecdd; --line:#e2d7bf; --ink:#1a2438; --ink2:#2c3a52; --muted:#8a7b5c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Heebo','Segoe UI',Arial,sans-serif; background:var(--paper); color:var(--ink); }
  header.top { position:sticky; top:0; z-index:50; background:rgba(13,27,46,.96); color:#fff; display:flex; align-items:center; gap:18px; padding:10px 26px; }
  header.top .brand { font-weight:900; color:var(--gold-l); font-size:18px; text-decoration:none; }
  header.top .crumb { font-size:14.5px; opacity:.85; }
  .hero { background:var(--navy); color:#fff; text-align:center; padding:38px 20px 30px; }
  .hero h1 { font-size:34px; font-weight:900; color:var(--gold-l); }
  .hero p { opacity:.8; margin-top:6px; }
  .hero input {
    margin-top:18px; font-family:inherit; font-size:16px; padding:11px 20px; border-radius:24px; border:none;
    width:min(420px, 86vw); text-align:center; background:#fff; color:var(--ink);
  }
  .wrap { max-width:1050px; margin:0 auto; padding:28px 22px 50px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
  .fig-card { display:block; text-decoration:none; color:var(--ink); background:#fff; border-radius:14px; padding:18px 20px; box-shadow:0 2px 12px rgba(13,27,46,.08); border-top:4px solid var(--gold); transition:.15s; }
  .fig-card:hover { transform:translateY(-3px); box-shadow:0 8px 22px rgba(13,27,46,.14); }
  .fig-card h3 { font-size:18px; font-weight:800; color:var(--navy); }
  .fig-card .role { font-size:13px; color:var(--gold); font-weight:600; margin:3px 0 7px; }
  .fig-card p { font-size:13.5px; line-height:1.6; color:var(--ink2); }
  footer { text-align:center; padding:22px; font-size:13.5px; color:var(--muted); background:var(--paper2); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">מסע הדורות</a>
  <span class="crumb"><b>דמויות המסע</b></span>
</header>
<div class="hero">
  <h1>👥 דמויות המסע</h1>
  <p>כל דמות היא ישות אחת במערכת — לחצו כדי לראות את כל המופעים שלה</p>
  <input id="search" type="search" placeholder="חיפוש דמות... (למשל: שמעון)">
</div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<footer>מסע הדורות</footer>
<script>
(async () => {
  const { figures } = await (await fetch('content/figures.json')).json();
  const grid = document.getElementById('grid');
  const render = q => {
    const list = q ? figures.filter(f => (f.name + f.role + (f.dynasty||'') + f.summary).includes(q)) : figures;
    grid.innerHTML = list.map(f => `
      <a class="fig-card" href="figure.html#${f.id}">
        <h3>${f.name}</h3>
        <div class="role">${f.role}${f.dynasty ? ' · ' + f.dynasty : ''}</div>
        <p>${f.tagline}</p>
      </a>`).join('') || '<p style="color:var(--muted)">לא נמצאה דמות מתאימה.</p>';
  };
  render('');
  document.getElementById('search').addEventListener('input', e => render(e.target.value.trim()));
})();
</script>
</body>
</html>
