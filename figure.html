<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסע הדורות — דמות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&display=swap');
  :root {
    --navy:#0d1b2e; --navy2:#16263e; --gold:#b0862f; --gold-l:#e8c46a;
    --paper:#faf6ee; --paper2:#f3ecdd; --line:#e2d7bf; --ink:#1a2438; --ink2:#2c3a52; --muted:#8a7b5c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Heebo','Segoe UI',Arial,sans-serif; background:var(--paper); color:var(--ink); }

  header.top {
    position:sticky; top:0; z-index:50; background:rgba(13,27,46,.96); color:#fff;
    display:flex; align-items:center; gap:18px; padding:10px 26px;
  }
  header.top .brand { font-weight:900; color:var(--gold-l); font-size:18px; text-decoration:none; white-space:nowrap; }
  header.top .crumb { font-size:14.5px; opacity:.85; }

  .hero {
    background:
      radial-gradient(ellipse at 50% 130%, rgba(176,134,47,.4), transparent 60%), var(--navy);
    color:#fff; text-align:center; padding:52px 20px 42px;
  }
  .hero .role { color:var(--gold-l); font-size:15px; font-weight:600; letter-spacing:1px; }
  .hero h1 { font-size:46px; font-weight:900; margin:6px 0 4px; }
  .hero .tag { font-size:19px; opacity:.85; }

  .wrap { max-width:1000px; margin:0 auto; padding:0 22px; }

  .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin:28px 0; }
  @media (max-width:760px){ .grid { grid-template-columns:1fr; } }
  .card { background:#fff; border-radius:14px; padding:22px 24px; box-shadow:0 2px 12px rgba(13,27,46,.08); }
  .card h2 { font-size:16px; color:var(--gold); font-weight:800; letter-spacing:.5px; margin-bottom:10px; }
  .card p { font-size:16.5px; line-height:1.85; color:var(--ink2); }
  .card .lesson { background:var(--paper2); border-right:4px solid var(--gold); border-radius:8px; padding:12px 16px; font-size:15.5px; color:var(--ink2); }

  section.sec { margin:34px 0; }
  section.sec > h2 { font-size:24px; font-weight:900; color:var(--navy); margin-bottom:16px; display:flex; align-items:center; gap:14px; }
  section.sec > h2::after { content:''; flex:1; height:2px; background:linear-gradient(to left, var(--gold), transparent); }

  .apps { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
  .app { display:block; background:#fff; border-radius:12px; overflow:hidden; text-decoration:none; color:var(--ink); box-shadow:0 2px 10px rgba(13,27,46,.08); transition:.15s; }
  .app:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(13,27,46,.15); }
  .app img { width:100%; display:block; }
  .app .cap { padding:12px 15px; }
  .app .cap .ch { font-size:12.5px; color:var(--gold); font-weight:700; }
  .app .cap .t { font-size:15.5px; font-weight:700; margin-top:2px; }

  .peers { display:flex; flex-wrap:wrap; gap:10px; }
  .peer { display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 18px; text-decoration:none; color:var(--ink); transition:.15s; min-width:160px; }
  .peer:hover { border-color:var(--gold); box-shadow:0 4px 12px rgba(13,27,46,.1); }
  .peer .n { font-weight:800; font-size:15.5px; }
  .peer .r { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .backnav { display:flex; gap:12px; margin:34px 0 44px; flex-wrap:wrap; }
  .backnav a { text-decoration:none; background:#fff; border:1px solid var(--line); color:var(--navy); border-radius:12px; padding:12px 20px; font-weight:700; font-size:15px; }
  .backnav a:hover { border-color:var(--gold); }

  footer { text-align:center; padding:22px; font-size:13.5px; color:var(--muted); background:var(--paper2); }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html">מסע הדורות</a>
  <span class="crumb" id="crumb">דמויות המסע</span>
</header>

<div class="hero">
  <div class="role" id="h-role"></div>
  <h1 id="h-name"></h1>
  <div class="tag" id="h-tag"></div>
</div>

<div class="wrap">
  <div class="grid">
    <div class="card"><h2>מי היה?</h2><p id="f-summary"></p></div>
    <div class="card"><h2>מה למדנו ממנו?</h2><div class="lesson" id="f-lesson"></div></div>
  </div>

  <section class="sec" id="extended-sec" style="display:none">
    <h2>מבט מעמיק</h2>
    <div class="card" id="extended"></div>
  </section>

  <section class="sec">
    <h2>המופעים במסע</h2>
    <div class="apps" id="apps"></div>
  </section>

  <section class="sec">
    <h2>פעלו לצידו</h2>
    <div class="peers" id="peers"></div>
  </section>

  <div class="backnav" id="backnav">
    <a href="figures.html">👥 כל הדמויות</a>
    <a href="index.html">🗺️ מפת המסע</a>
  </div>
</div>

<footer>ישות ידע אחת — מקושרת לכל הפרקים שבהם היא מופיעה · מסע הדורות</footer>

<script>
(async () => {
  const fid = (location.hash || '').replace('#','');
  const [site, figData] = await Promise.all([
    (await fetch('content/index.json')).json(),
    (await fetch('content/figures.json')).json()
  ]);
  const fig = figData.figures.find(f => f.id === fid);
  if (!fig) { document.getElementById('h-name').textContent = 'הדמות לא נמצאה'; return; }

  document.title = `${fig.name} | מסע הדורות`;
  document.getElementById('crumb').innerHTML = `דמויות המסע ← <b>${fig.name}</b>`;
  document.getElementById('h-role').textContent = `${fig.role}${fig.dynasty ? ' · ' + fig.dynasty : ''}`;
  document.getElementById('h-name').textContent = fig.name;
  document.getElementById('h-tag').textContent = fig.tagline;
  document.getElementById('f-summary').textContent = fig.summary;
  document.getElementById('f-lesson').textContent = '💡 ' + fig.lesson;

  if (fig.extended && fig.extended.length) {
    document.getElementById('extended-sec').style.display = '';
    document.getElementById('extended').innerHTML = fig.extended.map(sec =>
      `${sec.heading ? `<h3 style="font-size:18px;font-weight:800;color:var(--navy);margin:14px 0 6px">${sec.heading}</h3>` : ''}
       ${sec.paragraphs.map(p => `<p style="margin-bottom:10px">${p}</p>`).join('')}`).join('');
  }

  const readyChapters = site.parts.flatMap(p => p.chapters.filter(c => c.status === 'ready'));
  const chDatas = await Promise.all(readyChapters.map(async c => ({ meta: c, data: await (await fetch(c.file)).json() })));

  const apps = [], peerIds = new Set();
  for (const { meta, data } of chDatas) {
    for (const s of data.slides) {
      const fids = s.figures || [];
      if (fids.includes(fid)) {
        apps.push({ ch: data, meta, slide: s });
        fids.forEach(x => { if (x !== fid) peerIds.add(x); });
      }
    }
  }

  const heL = n => ['','א','ב','ג','ד','ה','ו','ז','ח','ט','י'][n] || n;
  document.getElementById('apps').innerHTML = apps.length ? apps.map(a => `
    <a class="app" href="chapter.html#${a.ch.id}">
      <img loading="lazy" src="${a.slide.image}" alt="${a.slide.title}">
      <div class="cap">
        <div class="ch">פרק ${heL(a.ch.chapter)}' · ${a.ch.title} · שקף ${a.slide.n}</div>
        <div class="t">${a.slide.title}</div>
      </div>
    </a>`).join('') : '<p style="color:var(--muted)">אין עדיין מופעים בפרקים שהועלו.</p>';

  document.getElementById('peers').innerHTML = [...peerIds].map(pid => {
    const p = figData.figures.find(f => f.id === pid); if (!p) return '';
    return `<a class="peer" href="figure.html#${p.id}" onclick="setTimeout(()=>location.reload())">
      <span class="n">${p.name}</span><span class="r">${p.role}</span></a>`;
  }).join('') || '<p style="color:var(--muted)">—</p>';
})();
window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
